namespace: limitless

backend:
  image:
    repository: ghcr.io/badconfigstudios/limitless-organizer-tracker/backend
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 8000
  env:
    CORS_ALLOWED_ORIGINS: "https://limitless-org-dashboard.badconfig.com"
    LIMITLESS_BASE_URL: "https://play.limitlesstcg.com"
    LIMITLESS_APPLICATION_ID: ""
    DASHBOARD_BASE_URL: "https://limitless-org-dashboard.badconfig.com"
    SESSION_COOKIE_SECURE: "true"

frontend:
  image:
    repository: ghcr.io/badconfigstudios/limitless-organizer-tracker/frontend
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 80

docs:
  image:
    repository: ghcr.io/badconfigstudios/limitless-organizer-tracker/docs
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 80

worker:
  image:
    repository: ghcr.io/badconfigstudios/limitless-organizer-tracker/worker
    tag: latest
    pullPolicy: Always

celery:
  worker:
    replicas: 1
  beat:
    replicas: 1

ingress:
  enabled: true
  className: nginx
  host: limitless-org-dashboard.badconfig.com
  tls: false

# Secrets — override in values.production.yaml or via --set
secrets:
  databaseUrl: ""
  celeryBrokerUrl: ""
  celeryResultBackend: ""
  discordWebhookUrl: ""
  limitlessUsername: ""
  limitlessPassword: ""
  apiKeys: ""
  adminUsername: ""
  adminPassword: ""
  sessionSecretKey: ""

# Percona PostgreSQL Operator CRD
percona:
  enabled: true
  clusterName: limitless-pg
  pgVersion: "16"
  storageSize: 5Gi

# Bitnami Redis subchart
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  image:
    registry: docker.io
    repository: bitnami/redis
    tag: latest
  master:
    persistence:
      size: 1Gi
